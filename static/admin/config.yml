backend:
  name: github
  repo: NikeTao-hub/NikeTao-hub.github.io
  branch: main
  base_url: https://niketao-blog-oauth.niketao-cug.workers.dev
  auth_endpoint: /auth
  site_domain: niketao.com

locale: zh_Hans

# Decap CMS requires this field.
# New images are NOT uploaded here.
# Vditor and cloudinary-image upload directly to Cloudinary.
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: homepage
    label: 主页
    files:
      - name: content
        label: 主页内容
        file: homepage/content.json
        format: json
        fields:
          - name: hero
            label: 首屏介绍
            widget: object
            fields:
              - { name: name, label: 姓名, widget: string }
              - { name: tagline, label: 英文介绍, widget: text, hint: "换行会原样显示" }
              - { name: intro, label: 中文介绍, widget: text, hint: "换行会原样显示" }
              - { name: note, label: 手写标语, widget: text, hint: "换行会原样显示" }
              - { name: location, label: 位置文字, widget: text, hint: "换行会原样显示" }
              - { name: image, label: 首屏背景图, widget: cloudinary-image }

          - { name: currentlyUpdated, label: Currently 更新时间, widget: string }

          - name: currently
            label: Currently 状态
            widget: list
            min: 5
            max: 5
            collapsed: true
            summary: "{{fields.label}} · {{fields.title}}"
            fields:
              - { name: label, label: 类型, widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: description, label: 说明, widget: string }

          - name: projects
            label: 精选项目
            widget: list
            min: 1
            max: 3
            collapsed: true
            summary: "{{fields.type}} · {{fields.title}}"
            fields:
              - { name: type, label: 类型, widget: string }
              - { name: title, label: 项目名称, widget: string }
              - { name: description, label: 项目说明, widget: text }
              - { name: url, label: 链接, widget: string }
              - { name: image, label: 项目图片, widget: cloudinary-image }

          - name: photos
            label: 照片墙
            widget: list
            min: 1
            max: 6
            collapsed: true
            summary: "{{fields.alt}}"
            fields:
              - { name: image, label: 图片, widget: cloudinary-image }
              - { name: alt, label: 图片说明, widget: string }

          - name: book
            label: 正在阅读
            widget: object
            fields:
              - { name: title, label: 书名, widget: string }
              - { name: coverTitle, label: 封面文字, widget: text, hint: "支持换行" }
              - { name: author, label: 作者, widget: string }
              - { name: progress, label: 阅读进度, widget: number, min: 0, max: 100, value_type: int }

          - name: music
            label: 最近音乐
            widget: object
            fields:
              - { name: title, label: 曲目, widget: string }
              - { name: artist, label: 艺术家, widget: string }
              - { name: cover, label: 封面, widget: cloudinary-image }

          - name: stats
            label: 统计信息
            widget: object
            fields:
              - { name: since, label: 开始时间, widget: string }
              - { name: status, label: 当前状态, widget: string }
              - { name: books, label: 已读书籍数, widget: string }
              - { name: photos, label: 照片数量, widget: string }

  - name: posts
    label: 文章
    folder: content/post
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:

      - name: title
        label: 标题
        widget: string

      - name: date
        label: 日期
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - name: description
        label: 文章简介
        widget: text
        required: false
        hint: "用于文章列表和页面摘要，建议 50～100 字"

      - name: draft
        label: 保存为草稿（开启后不公开）
        widget: boolean
        default: false
        required: false
        hint: "默认关闭：保存并部署后公开。只有暂不发布时才开启；草稿即使 Actions 成功也不会出现在博客。"

      - name: categories
        label: 分类
        widget: select
        required: true
        options:
          - 科研
          - 生活
          - 技术
        hint: "选择文章所属的主要分类"

      - name: tags
        label: 标签
        widget: list
        required: false
        allow_add: true
        field:
          label: 标签
          name: tag
          widget: string

      - name: image
        label: 封面图
        widget: cloudinary-image
        required: false
        hint: "上传到 Cloudinary，自动保存图片 URL"

      - name: toc
        label: 显示目录
        widget: boolean
        default: true
        required: false

      - name: body
        label: 正文
        widget: vditor
