backend:
  name: github
  repo: NikeTao-hub/niketao.github.io
  branch: main
  base_url: https://oauth.niketao.com
  auth_endpoint: /auth

media_folder: "static/images"
public_folder: "/images"
locale: zh_Hans

collections:
  - name: "posts"
    label: "文章"
    folder: "content/post"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "发布日期"
        name: "date"
        widget: "datetime"
      - label: "草稿"
        name: "draft"
        widget: "boolean"
        default: false
      - label: "正文"
        name: "body"
        widget: "markdown"
