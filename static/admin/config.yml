backend:
  name: github
  repo: NikeTao-hub/NikeTao-hub.github.io
  branch: main
  base_url: https://niketao-blog-oauth.niketao-cug.workers.dev
  auth_endpoint: /auth
  site_domain: niketao.com

locale: zh_Hans
publish_mode: editorial_workflow

# media_folder: "static/images/uploads"
# public_folder: "/images/uploads"

collections:
  - name: posts
    label: 文章
    folder: content/post
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:

      - name: title
        label: 标题
        widget: string

      - name: date
        label: 日期
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - name: description
        label: 文章简介
        widget: text
        required: false
        hint: "用于文章列表和页面摘要，建议 50～100 字"

      - name: categories
        label: 分类
        widget: select
        required: true
        options:
          - 科研
          - 生活
          - 技术
        hint: "选择文章所属的主要分类"

      - name: tags
        label: 标签
        widget: list
        required: false
        allow_add: true
        field:
          label: 标签
          name: tag
          widget: string

      - name: image
        label: 封面图
        widget: cloudinary-image
        required: false
        hint: "上传到 Cloudinary，自动保存图片 URL"

      - name: toc
        label: 显示目录
        widget: boolean
        default: true
        required: false

      - name: body
        label: 正文
        widget: vditor
